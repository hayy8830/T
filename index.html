<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>project register</title>
</head>

<body>
    <header>
        <div class="logo">
            <h1>سلام</h1>
        </div>
        <nav>
            <div class="links">
                <a href="#">درباره خودم</a>
                <a href="#">ارتباط با من</a>
                <a href="#">پروژه ها</a>
                <a href="#">صفحه اصلی</a>
            </div>
        </nav>
    </header>
    <main>
        <div class="box-register">
            <form action="#" class="form-register">
                <h2>ساخت حساب</h2>
                <input type="text" id="username" name="username" placeholder="نام کاربری" required autofocus>
                <input type="email" id="email" name="email" placeholder="ایمیل" required>
                <input type="password" id="password" name="password" placeholder="رمز عبور">
                <button type="submit">ثبت نام</button>
            </form>
        </div>
    </main>
    <footer>
        <p> &copy; کلیه حقوق مادی و معنوی این سایت محفوظ است 2026</p>
    </footer>
</body>

</html>
